# --- Models (src/asr_engine/models/<model>/) -----------------------------------
# cynipsnet_v1.0 was generated by ST Edge AI Core 4.0.0-20500 (359356bb0) with the
# ATONN compiler 1.1.3-262 (`--target stm32n6`, ST Neural-ART). The split by
# license and the training datasets: src/asr_engine/models/LICENSE.md.

# Generated by the owner's n6_nn_fit/tools/emit_network_shape.py.
[[annotations]]
path = "src/asr_engine/models/*/network_shape.h"
SPDX-FileCopyrightText = "2026 Nikita Prismakov"
SPDX-License-Identifier = "Apache-2.0"

# Prebuilt network library and its headers, generated by ST Edge AI Core and
# modified by the owner: the generated C sources are distributed as the
# archive, with private symbols and diagnostic tensor tables removed; the
# headers retain the ST notices and expose only the API and the input/output
# geometry.
[[annotations]]
path = [
    "src/asr_engine/models/*/libcynipsnet.a",
    "src/asr_engine/models/*/network.h",
    "src/asr_engine/models/*/stai_network.h",
]
precedence = "override"
SPDX-FileCopyrightText = ["STMicroelectronics", "2026 Nikita Prismakov"]
SPDX-License-Identifier = "LicenseRef-ST-SLA0104"

# Weights and conversion reports: non-commercial.
[[annotations]]
path = [
    "src/asr_engine/models/*/network_atonbuf.*.bin",
    "src/asr_engine/models/*/converter_log.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nikita Prismakov"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

